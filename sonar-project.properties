# SonarQube / SonarCloud configuration.
#   SonarCloud:  sonar-scanner -Dsonar.token=<token>
#   Local:       sonar-scanner -Dsonar.host.url=http://localhost:9000 -Dsonar.token=<token>
#
# Change sonar.organization / sonar.projectKey to your own before the first scan.

sonar.projectKey=bi-migration-assistant
sonar.projectName=Cross-Platform BI Migration Assistant
sonar.projectVersion=1.0.0
# sonar.organization=your-sonarcloud-org

sonar.sources=src,tools
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.10,3.11,3.12,3.13

# Coverage: generate with
#   .venv/Scripts/python.exe -m pytest --cov=src --cov-report=xml
# (needs `pip install pytest-cov`; the file is git-ignored)
sonar.python.coverage.reportPaths=coverage.xml

# Never scan generated output, samples, the virtualenv or third-party bytes.
sonar.exclusions=\
  output/**,\
  input/**,\
  .venv/**,\
  **/__pycache__/**,\
  docs/**,\
  **/*.xlsx

# Test fixtures are real captured data, not hand-written code: duplication there is expected.
sonar.cpd.exclusions=tests/fixtures/**

# The front-end ships unminified on purpose (no build step).
sonar.javascript.exclusions=**/node_modules/**
